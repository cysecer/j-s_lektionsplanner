# Local services for development. Production uses the same Postgres major
# version; see README.md.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lektionsplaner
      POSTGRES_PASSWORD: lektionsplaner
      POSTGRES_DB: lektionsplaner
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lektionsplaner"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every outgoing email in development; web UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  db-data:
